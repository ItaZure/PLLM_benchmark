<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>维度管理 · PLLM Benchmark</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --border: rgba(0,0,0,0.08); }
  body { font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; }
  .mono { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .nav-item { height:36px; border-radius:6px; padding:0 12px; display:flex; align-items:center; gap:8px; font-size:13px; color:rgba(0,0,0,.65); }
  .nav-item:hover { background:#f0f0f0; }
  .nav-item.active { background:#ececec; color:#1a1a1a; font-weight:500; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:rgba(0,0,0,.4); box-shadow:0 0 0 3px rgba(0,0,0,.06); }
  .drawer-mask { transition: opacity .25s ease-out; }
  .drawer-panel { transition: transform .25s cubic-bezier(0.4,0,0.2,1); }
  .chev { transition: transform .2s ease-out; }
</style>
</head>
<body class="bg-white antialiased text-[13px]">
<div class="flex h-screen overflow-hidden">
  <aside class="w-[220px] shrink-0 bg-[#fafafa] border-r border-[var(--border)] flex flex-col">
    <div class="h-14 flex items-center gap-2 px-4 border-b border-[var(--border)]">
      <div class="w-6 h-6 rounded-md bg-[#1a1a1a] flex items-center justify-center text-white text-[12px] font-semibold">P</div>
      <span class="text-[14px] font-semibold">PLLM Benchmark</span>
    </div>
    <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto">
      <div class="px-3 pt-1 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">模型</div>
      <a href="model-management.html" class="nav-item">Chat 模型</a>
      <a href="#" class="nav-item">图片生成模型</a>
      <div class="px-3 pt-3 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">Benchmark</div>
      <a href="dimensions.html" class="nav-item active">维度管理</a>
      <a href="#" class="nav-item">任务管理</a>
      <div class="px-3 pt-3 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">评测</div>
      <a href="evaluation-run.html" class="nav-item">评测运行</a>
      <a href="blind-scoring.html" class="nav-item">盲评打分</a>
      <a href="#" class="nav-item">历史结果</a>
    </nav>
    <div class="p-3 border-t border-[var(--border)]"><a href="index.html" class="text-[12px] text-black/45 hover:text-black">← Demo 索引</a></div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 shrink-0 flex items-center justify-between px-6 border-b border-[var(--border)]">
      <div class="flex items-center gap-3">
        <h1 class="text-[18px] font-semibold">维度管理</h1>
        <span class="text-[12px] text-black/45 mono">共 3 个维度</span>
      </div>
      <button onclick="openDrawer()" class="h-8 px-3.5 rounded-md bg-[#1a1a1a] text-white text-[13px] font-medium hover:bg-black active:scale-[0.98] transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增维度
      </button>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <div id="list" class="space-y-3 max-w-4xl"></div>
    </main>
  </div>
</div>
<div id="drawer" class="fixed inset-0 z-40 hidden">
  <div id="drawerMask" class="drawer-mask absolute inset-0 bg-black/40 opacity-0" onclick="closeDrawer()"></div>
  <div id="drawerPanel" class="drawer-panel absolute right-0 top-0 h-full w-[480px] bg-white border-l border-[var(--border)] shadow-[-8px_0_32px_rgba(0,0,0,0.08)] flex flex-col translate-x-full">
    <div class="h-14 shrink-0 flex items-center justify-between px-5 border-b border-[var(--border)]">
      <h2 id="drawerTitle" class="text-[14px] font-semibold">新增维度</h2>
      <button onclick="closeDrawer()" class="w-7 h-7 rounded-md hover:bg-[#f5f5f5] flex items-center justify-center text-black/50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="flex-1 overflow-auto px-5 py-5 space-y-4">
      <div>
        <label class="block text-[13px] font-medium mb-1.5">维度名称 <span class="text-red-600">*</span></label>
        <input id="fName" placeholder="如 写作、数学、代码" class="w-full h-8 px-2.5 text-[13px] border border-black/12 rounded-md placeholder:text-black/35" />
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5">描述</label>
        <input id="fDesc" placeholder="可选，简要说明该维度考察的能力" class="w-full h-8 px-2.5 text-[13px] border border-black/12 rounded-md placeholder:text-black/35" />
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5">System Prompt</label>
        <textarea id="fSys" rows="7" class="w-full px-2.5 py-2 text-[13px] border border-black/12 rounded-md resize-y leading-relaxed" placeholder="该维度固定的系统提示词，评测时作为 system role 传给模型，可为空。">你是一位资深写作助手，请用准确、优雅、结构清晰的中文完成用户的写作任务。</textarea>
        <p class="mt-1 text-[12px] text-black/45">评测时作为 system 消息拼接在任务提示词之前；留空则不发送 system。</p>
      </div>
    </div>
    <div class="shrink-0 flex items-center justify-end gap-2 px-5 py-3.5 border-t border-[var(--border)]">
      <button onclick="closeDrawer()" class="h-8 px-3.5 rounded-md border border-black/16 text-[13px] text-black/75 hover:bg-[#f5f5f5]">取消</button>
      <button onclick="closeDrawer()" class="h-8 px-3.5 rounded-md bg-[#1a1a1a] text-white text-[13px] font-medium hover:bg-black active:scale-[0.98]">保存</button>
    </div>
  </div>
</div>
<script>
const allModels = ['GPT-4o','Claude Opus 4','DeepSeek V3','Qwen2.5-72B','本地 Ollama'];
const dims = [
  { name:'写作', desc:'中文创作、改写、润色能力', sys:'你是一位资深写作助手…', tasks:6, white:['GPT-4o','Claude Opus 4','DeepSeek V3'], open:true },
  { name:'数学', desc:'数值计算与推理', sys:'请逐步推理并给出最终答案。', tasks:12, white:['GPT-4o','Claude Opus 4','Qwen2.5-72B'], open:false },
  { name:'代码', desc:'代码生成与调试', sys:'', tasks:8, white:['Claude Opus 4','DeepSeek V3'], open:false },
];

function render(){
  document.getElementById('list').innerHTML = dims.map((d,i)=>`
    <div class="border border-[var(--border)] rounded-lg overflow-hidden">
      <div class="flex items-center gap-3 px-4 h-[52px] cursor-pointer hover:bg-[#fafafa] transition-colors" onclick="toggle(${i})">
        <svg class="chev w-4 h-4 text-black/40 ${d.open?'rotate-90':''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-[14px] font-semibold">${d.name}</span>
            <span class="text-[11px] text-black/45">${d.desc||'—'}</span>
          </div>
        </div>
        <span class="text-[12px] text-black/55 mono">${d.tasks} 任务</span>
        <span class="text-[12px] text-black/55 mono">${d.white.length} 模型</span>
        <button onclick="event.stopPropagation();openDrawer(${i})" class="text-[12px] text-black/65 hover:text-black hover:underline">编辑</button>
      </div>
      <div class="${d.open?'':'hidden'} border-t border-black/[0.05] bg-[#fcfcfc] px-4 py-4">
        ${d.sys?`<div class="mb-3"><div class="text-[11px] uppercase tracking-wide text-black/40 font-medium mb-1">System Prompt</div><div class="text-[12px] text-black/70 leading-relaxed border border-[var(--border)] rounded-md bg-white px-3 py-2">${d.sys}</div></div>`:''}
        <div class="text-[11px] uppercase tracking-wide text-black/40 font-medium mb-1.5">模型白名单 · 勾选加入评测范围</div>
        <div class="grid grid-cols-2 gap-1.5">
          ${allModels.map(m=>{const on=d.white.includes(m);return `
            <label class="flex items-center gap-2 h-8 px-2.5 rounded-md border ${on?'border-black/16 bg-white':'border-transparent'} hover:bg-white cursor-pointer transition-colors">
              <span onclick="event.preventDefault();togWhite(${i},'${m}')" class="w-4 h-4 rounded flex items-center justify-center shrink-0 border ${on?'bg-[#1a1a1a] border-[#1a1a1a]':'border-black/24 bg-white'}">
                ${on?'<svg class=\"w-3 h-3 text-white\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"/></svg>':''}
              </span>
              <span class="text-[13px] ${on?'text-black':'text-black/55'}">${m}</span>
            </label>`}).join('')}
        </div>
      </div>
    </div>`).join('');
}
function toggle(i){ dims[i].open=!dims[i].open; render(); }
function togWhite(i,m){
  const w=dims[i].white; const idx=w.indexOf(m);
  if(idx>=0) w.splice(idx,1); else w.push(m);
  render();
}
function openDrawer(i){
  document.getElementById('drawerTitle').textContent = (typeof i==='number')?'编辑维度':'新增维度';
  const d=document.getElementById('drawer'); d.classList.remove('hidden');
  requestAnimationFrame(()=>{ document.getElementById('drawerMask').style.opacity='1'; document.getElementById('drawerPanel').classList.remove('translate-x-full'); });
}
function closeDrawer(){
  document.getElementById('drawerMask').style.opacity='0';
  document.getElementById('drawerPanel').classList.add('translate-x-full');
  setTimeout(()=>document.getElementById('drawer').classList.add('hidden'),250);
}
render();
</script>

</body>
</html>
