<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>评测运行 · PLLM Benchmark</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --border: rgba(0,0,0,0.08); }
  body { font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; }
  .mono { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .nav-item { height:36px; border-radius:6px; padding:0 12px; display:flex; align-items:center; gap:8px; font-size:13px; color:rgba(0,0,0,.65); }
  .nav-item:hover { background:#f0f0f0; }
  .nav-item.active { background:#ececec; color:#1a1a1a; font-weight:500; }
  .spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar-fill { transition: width .3s ease-out; }
  .cursor-blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body class="bg-white antialiased text-[13px]">
<div class="flex h-screen overflow-hidden">
  <aside class="w-[220px] shrink-0 bg-[#fafafa] border-r border-[var(--border)] flex flex-col">
    <div class="h-14 flex items-center gap-2 px-4 border-b border-[var(--border)]">
      <div class="w-6 h-6 rounded-md bg-[#1a1a1a] flex items-center justify-center text-white text-[12px] font-semibold">P</div>
      <span class="text-[14px] font-semibold">PLLM Benchmark</span>
    </div>
    <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto">
      <div class="px-3 pt-1 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">模型</div>
      <a href="model-management.html" class="nav-item">Chat 模型</a>
      <a href="#" class="nav-item">图片生成模型</a>
      <div class="px-3 pt-3 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">Benchmark</div>
      <a href="dimensions.html" class="nav-item">维度管理</a>
      <a href="#" class="nav-item">任务管理</a>
      <div class="px-3 pt-3 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">评测</div>
      <a href="evaluation-run.html" class="nav-item active">评测运行</a>
      <a href="blind-scoring.html" class="nav-item">盲评打分</a>
      <a href="#" class="nav-item">历史结果</a>
    </nav>
    <div class="p-3 border-t border-[var(--border)]"><a href="index.html" class="text-[12px] text-black/45 hover:text-black">← Demo 索引</a></div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 shrink-0 flex items-center justify-between px-6 border-b border-[var(--border)]">
      <div class="flex items-center gap-3">
        <h1 class="text-[18px] font-semibold">评测运行中</h1>
        <span id="runBadge" class="inline-flex items-center gap-1.5 h-5 px-2 rounded text-[11px] font-medium" style="color:#1d4ed8;background:#eff6ff"><svg class="w-3 h-3 spin" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>running</span>
      </div>
      <button id="cancelBtn" onclick="cancelRun()" class="h-8 px-3.5 rounded-md border border-[#b91c1c]/30 text-[13px] text-[#b91c1c] hover:bg-[#fef2f2] transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>取消评测
      </button>
    </header>

    <main class="flex-1 overflow-auto p-6 space-y-4">
      <!-- 总进度 -->
      <div class="border border-[var(--border)] rounded-lg p-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[13px] font-medium">总进度</span>
          <span class="text-[12px] text-black/55 mono"><span id="doneCount">0</span> / <span id="totalCount">0</span> 完成</span>
        </div>
        <div class="h-1.5 rounded-full bg-[#f0f0f0] overflow-hidden">
          <div id="totalBar" class="bar-fill h-full bg-[#1a1a1a]" style="width:0%"></div>
        </div>
      </div>

      <!-- 任务×模型 组合 -->
      <div id="grid" class="space-y-3"></div>
    </main>
  </div>
</div>
<script>
const SAMPLE = "在江南的春日里，细雨如丝，沿着青石板路缓缓流淌。远处的白墙黛瓦在薄雾中若隐若现，仿佛一幅未干的水墨画。行人撑着油纸伞，脚步轻缓，生怕惊扰了这份宁静。";
const models = ['GPT-4o','Claude Opus 4','DeepSeek V3'];
const tasks = ['写一段江南春景描写','解释快速排序的时间复杂度'];

// 组合：task × model
let combos = [];
tasks.forEach((t,ti)=>models.forEach((m,mi)=>{
  combos.push({ task:t, model:m, status:'pending', text:'', ttft:null, cps:null });
}));

function statusTag(c){
  if(c.status==='pending') return `<span class="inline-flex items-center gap-1.5 h-5 px-2 rounded text-[11px] font-medium" style="color:rgba(0,0,0,.55);background:#f5f5f5"><span class="w-1.5 h-1.5 rounded-full bg-black/40"></span>等待中</span>`;
  if(c.status==='streaming') return `<span class="inline-flex items-center gap-1.5 h-5 px-2 rounded text-[11px] font-medium" style="color:#1d4ed8;background:#eff6ff"><svg class="w-3 h-3 spin" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>streaming</span>`;
  if(c.status==='success') return `<span class="inline-flex items-center gap-1.5 h-5 px-2 rounded text-[11px] font-medium" style="color:#15803d;background:#f0fdf4"><span class="w-1.5 h-1.5 rounded-full" style="background:#15803d"></span>success</span>`;
  return `<span class="inline-flex items-center gap-1.5 h-5 px-2 rounded text-[11px] font-medium" style="color:#b45309;background:#fffbeb"><span class="w-1.5 h-1.5 rounded-full" style="background:#b45309"></span>cancelled</span>`;
}

function metrics(c){
  if(c.status!=='success') return '';
  return `<div class="flex items-center gap-4 mt-2 text-[12px] mono text-black/55">
    <span>TTFT <span class="text-black/80">${c.ttft}ms</span></span>
    <span>速度 <span class="text-black/80">${c.cps} 字/秒</span></span>
    <span>字符数 <span class="text-black/80">${c.text.length}</span></span>
  </div>`;
}

function render(){
  document.getElementById('totalCount').textContent = combos.length;
  document.getElementById('grid').innerHTML = combos.map((c,i)=>`
    <div class="border border-[var(--border)] rounded-lg overflow-hidden ${c.status==='streaming'?'ring-1 ring-blue-500/20':''}">
      <div class="flex items-center gap-3 px-4 h-11 bg-[#fafafa] border-b border-black/[0.05]">
        <span class="text-[13px] font-medium truncate max-w-[280px]">${c.task}</span>
        <span class="text-black/25">·</span>
        <span class="text-[12px] mono text-black/65">${c.model}</span>
        <div class="ml-auto">${statusTag(c)}</div>
      </div>
      <div class="px-4 py-3">
        ${c.status==='pending'
          ? '<div class="text-[12px] text-black/35">尚未开始…</div>'
          : `<div class="text-[13px] leading-relaxed text-black/80 whitespace-pre-wrap">${c.text}${c.status==='streaming'?'<span class="cursor-blink text-black/70">▋</span>':''}</div>${metrics(c)}`}
      </div>
    </div>`).join('');
}

let doneCount=0;
function updateTotal(){
  doneCount = combos.filter(c=>c.status==='success'||c.status==='cancelled').length;
  document.getElementById('doneCount').textContent = doneCount;
  document.getElementById('totalBar').style.width = (doneCount/combos.length*100)+'%';
}

let cancelled=false;
async function runAll(){
  for(let i=0;i<combos.length;i++){
    if(cancelled){ combos[i].status='cancelled'; updateTotal(); render(); continue; }
    await runOne(i);
  }
  if(!cancelled) finishRun();
}

function runOne(i){
  return new Promise(res=>{
    const c=combos[i];
    c.status='streaming'; render();
    const ttft = 180 + Math.floor(Math.random()*420);
    const t0 = performance.now();
    setTimeout(()=>{
      c.ttft = ttft;
      let idx=0;
      const timer=setInterval(()=>{
        if(cancelled){ clearInterval(timer); c.status='cancelled'; updateTotal(); render(); return res(); }
        idx += 2 + Math.floor(Math.random()*3);
        c.text = SAMPLE.slice(0, Math.min(idx, SAMPLE.length));
        render();
        if(idx>=SAMPLE.length){
          clearInterval(timer);
          const dur=(performance.now()-t0)/1000;
          c.status='success';
          c.cps=(c.text.length/dur).toFixed(1);
          updateTotal(); render(); res();
        }
      }, 55);
    }, ttft);
  });
}

function cancelRun(){
  if(cancelled) return;
  if(!confirm('取消本次评测？已完成的结果会保留，进行中和未开始的组合标记为 cancelled。')) return;
  cancelled=true;
  const b=document.getElementById('runBadge');
  b.style.color='#b45309'; b.style.background='#fffbeb';
  b.innerHTML='<span class="w-1.5 h-1.5 rounded-full" style="background:#b45309"></span>cancelled';
  document.getElementById('cancelBtn').disabled=true;
  document.getElementById('cancelBtn').classList.add('opacity-40','pointer-events-none');
}

function finishRun(){
  const b=document.getElementById('runBadge');
  b.style.color='#15803d'; b.style.background='#f0fdf4';
  b.innerHTML='<span class="w-1.5 h-1.5 rounded-full" style="background:#15803d"></span>done';
  document.getElementById('cancelBtn').classList.add('opacity-40','pointer-events-none');
}

render(); updateTotal(); runAll();
</script>

</body>
</html>
