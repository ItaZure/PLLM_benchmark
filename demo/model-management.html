<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>模型管理 · PLLM Benchmark</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --border: rgba(0,0,0,0.08); }
  body { font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; }
  .mono { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .nav-item { height:36px; border-radius:6px; padding:0 12px; display:flex; align-items:center; gap:8px; font-size:13px; color:rgba(0,0,0,.65); }
  .nav-item:hover { background:#f0f0f0; }
  .nav-item.active { background:#ececec; color:#1a1a1a; font-weight:500; }
  tbody tr:hover { background:#f5f5f5; }
  .spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .drawer-mask { transition: opacity .25s ease-out; }
  .drawer-panel { transition: transform .25s cubic-bezier(0.4,0,0.2,1); }
  input:focus, textarea:focus, select:focus { outline:none; border-color:rgba(0,0,0,.4); box-shadow:0 0 0 3px rgba(0,0,0,.06); }
</style>
</head>
<body class="bg-white antialiased text-[13px]">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-[220px] shrink-0 bg-[#fafafa] border-r border-[var(--border)] flex flex-col">
    <div class="h-14 flex items-center gap-2 px-4 border-b border-[var(--border)]">
      <div class="w-6 h-6 rounded-md bg-[#1a1a1a] flex items-center justify-center text-white text-[12px] font-semibold">P</div>
      <span class="text-[14px] font-semibold">PLLM Benchmark</span>
    </div>
    <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto">
      <div class="px-3 pt-1 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">模型</div>
      <a href="model-management.html" class="nav-item active">Chat 模型</a>
      <a href="#" class="nav-item">图片生成模型</a>
      <div class="px-3 pt-3 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">Benchmark</div>
      <a href="dimensions.html" class="nav-item">维度管理</a>
      <a href="#" class="nav-item">任务管理</a>
      <div class="px-3 pt-3 pb-1.5 text-[11px] font-medium tracking-wide text-black/40 uppercase">评测</div>
      <a href="evaluation-run.html" class="nav-item">评测运行</a>
      <a href="blind-scoring.html" class="nav-item">盲评打分</a>
      <a href="#" class="nav-item">历史结果</a>
    </nav>
    <div class="p-3 border-t border-[var(--border)]"><a href="index.html" class="text-[12px] text-black/45 hover:text-black">← Demo 索引</a></div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- TopBar -->
    <header class="h-14 shrink-0 flex items-center justify-between px-6 border-b border-[var(--border)]">
      <div class="flex items-center gap-3">
        <h1 class="text-[18px] font-semibold">Chat 模型</h1>
        <span class="text-[12px] text-black/45 mono">共 5 个</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="relative">
          <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-black/35" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
          <input placeholder="搜索模型…" class="h-8 w-[220px] pl-8 pr-3 text-[13px] border border-black/12 rounded-md placeholder:text-black/35" />
        </div>
        <button onclick="openDrawer()" class="h-8 px-3.5 rounded-md bg-[#1a1a1a] text-white text-[13px] font-medium hover:bg-black active:scale-[0.98] transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增模型
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto p-6">
      <div class="border border-[var(--border)] rounded-lg overflow-hidden">
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-[#fafafa] text-left text-[11px] uppercase tracking-wide text-black/50 font-medium">
              <th class="h-9 px-3 font-medium">名称</th>
              <th class="h-9 px-3 font-medium">API Base URL</th>
              <th class="h-9 px-3 font-medium">模型名</th>
              <th class="h-9 px-3 font-medium">状态</th>
              <th class="h-9 px-3 font-medium text-right">操作</th>
            </tr>
          </thead>
          <tbody id="rows" class="text-[13px]"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Drawer: 新增/编辑模型 -->
<div id="drawer" class="fixed inset-0 z-40 hidden">
  <div id="drawerMask" class="drawer-mask absolute inset-0 bg-black/40 opacity-0" onclick="closeDrawer()"></div>
  <div id="drawerPanel" class="drawer-panel absolute right-0 top-0 h-full w-[480px] bg-white border-l border-[var(--border)] shadow-[-8px_0_32px_rgba(0,0,0,0.08)] flex flex-col translate-x-full">
    <div class="h-14 shrink-0 flex items-center justify-between px-5 border-b border-[var(--border)]">
      <h2 id="drawerTitle" class="text-[14px] font-semibold">新增 Chat 模型</h2>
      <button onclick="closeDrawer()" class="w-7 h-7 rounded-md hover:bg-[#f5f5f5] flex items-center justify-center text-black/50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="flex-1 overflow-auto px-5 py-5 space-y-4">
      <div>
        <label class="block text-[13px] font-medium mb-1.5">显示名称 <span class="text-red-600">*</span></label>
        <input id="fName" placeholder="如 GPT-4o" class="w-full h-8 px-2.5 text-[13px] border border-black/12 rounded-md placeholder:text-black/35" />
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5">API Base URL <span class="text-red-600">*</span></label>
        <input id="fUrl" placeholder="https://api.openai.com" class="w-full h-8 px-2.5 text-[13px] mono border border-black/12 rounded-md placeholder:text-black/35" />
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5">API Key <span class="text-red-600">*</span></label>
        <input id="fKey" type="password" placeholder="sk-••••••••••••" class="w-full h-8 px-2.5 text-[13px] mono border border-black/12 rounded-md placeholder:text-black/35" />
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5">模型名（传给 API） <span class="text-red-600">*</span></label>
        <input id="fModel" placeholder="gpt-4o" class="w-full h-8 px-2.5 text-[13px] mono border border-black/12 rounded-md placeholder:text-black/35" />
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5">默认参数 JSON</label>
        <textarea id="fParams" rows="6" class="w-full px-2.5 py-2 text-[12px] mono border border-black/12 rounded-md resize-y" placeholder='{ "temperature": 0.7, "max_tokens": 2048 }'>{
  "temperature": 0.7,
  "max_tokens": 2048
}</textarea>
        <p class="mt-1 text-[12px] text-black/45">评测时合并到请求体，如 temperature、max_tokens。</p>
      </div>
    </div>
    <div class="shrink-0 flex items-center justify-end gap-2 px-5 py-3.5 border-t border-[var(--border)]">
      <button onclick="closeDrawer()" class="h-8 px-3.5 rounded-md border border-black/16 text-[13px] text-black/75 hover:bg-[#f5f5f5]">取消</button>
      <button onclick="saveModel()" class="h-8 px-3.5 rounded-md bg-[#1a1a1a] text-white text-[13px] font-medium hover:bg-black active:scale-[0.98]">保存</button>
    </div>
  </div>
</div>
<script>
const models = [
  { name:'GPT-4o', url:'https://api.openai.com', model:'gpt-4o', status:'ok' },
  { name:'Claude Opus 4', url:'https://api.anthropic.com', model:'claude-opus-4', status:'ok' },
  { name:'DeepSeek V3', url:'https://api.deepseek.com', model:'deepseek-chat', status:'untested' },
  { name:'Qwen2.5-72B', url:'https://dashscope.aliyuncs.com', model:'qwen2.5-72b-instruct', status:'error', err:'401 Unauthorized：API key 无效' },
  { name:'本地 Ollama', url:'http://localhost:11434', model:'llama3.1:70b', status:'untested' },
];

const badge = {
  ok:    ['可用','#15803d','#f0fdf4'],
  error: ['不可用','#b91c1c','#fef2f2'],
  untested:['未测试','rgba(0,0,0,0.55)','#f5f5f5'],
};

function badgeHtml(m){
  if(m.status==='testing'){
    return `<span class="inline-flex items-center gap-1.5 h-5 px-2 rounded text-[11px] font-medium" style="color:#1d4ed8;background:#eff6ff"><svg class="w-3 h-3 spin" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>测试中</span>`;
  }
  const [txt,c,bg]=badge[m.status];
  const dot=`<span class="w-1.5 h-1.5 rounded-full" style="background:${c}"></span>`;
  const tip = m.status==='error' && m.err ? `title="${m.err}"` : '';
  return `<span ${tip} class="inline-flex items-center gap-1.5 h-5 px-2 rounded text-[11px] font-medium ${m.status==='error'?'cursor-help':''}" style="color:${c};background:${bg}">${dot}${txt}</span>`;
}

function render(){
  document.getElementById('rows').innerHTML = models.map((m,i)=>`
    <tr class="border-t border-black/[0.05] ${i%2?'bg-[#fcfcfc]':''} transition-colors">
      <td class="px-3 py-2.5 font-medium">${m.name}</td>
      <td class="px-3 py-2.5 mono text-[12px] text-black/65">${m.url}</td>
      <td class="px-3 py-2.5 mono text-[12px] text-black/65">${m.model}</td>
      <td class="px-3 py-2.5">${badgeHtml(m)}</td>
      <td class="px-3 py-2.5 text-right whitespace-nowrap">
        <button onclick="testModel(${i})" class="text-[12px] text-black/65 hover:text-black hover:underline">测试可用性</button>
        <button onclick="openDrawer(${i})" class="ml-3 text-[12px] text-black/65 hover:text-black hover:underline">编辑</button>
        <button onclick="delModel(${i})" class="ml-3 text-[12px] text-[#b91c1c]/80 hover:text-[#b91c1c] hover:underline">删除</button>
      </td>
    </tr>`).join('');
}

function testModel(i){
  models[i].status='testing'; render();
  setTimeout(()=>{
    // mock：随机成功/失败
    const ok = Math.random()>0.35;
    models[i].status = ok?'ok':'error';
    if(!ok) models[i].err='连接超时或鉴权失败（mock）';
    render();
  }, 1200);
}
function delModel(i){ if(confirm('删除模型「'+models[i].name+'」？')){ models.splice(i,1); render(); } }

let editIdx = -1;
function openDrawer(i){
  editIdx = (typeof i==='number')?i:-1;
  document.getElementById('drawerTitle').textContent = editIdx>=0?'编辑 Chat 模型':'新增 Chat 模型';
  const d=document.getElementById('drawer');
  d.classList.remove('hidden');
  requestAnimationFrame(()=>{
    document.getElementById('drawerMask').style.opacity='1';
    document.getElementById('drawerPanel').classList.remove('translate-x-full');
  });
}
function closeDrawer(){
  document.getElementById('drawerMask').style.opacity='0';
  document.getElementById('drawerPanel').classList.add('translate-x-full');
  setTimeout(()=>document.getElementById('drawer').classList.add('hidden'),250);
}
function saveModel(){ closeDrawer(); }

render();
</script>

</body>
</html>
