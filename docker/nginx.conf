server {
    listen 80;
    server_name _;

    # Serve frontend static files.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # Local single-user tool: never cache static assets so frontend edits
        # take effect on a plain refresh (no hard-reload / version query needed).
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Reverse proxy /api to the FastAPI backend.
    # proxy_buffering off so SSE / streaming responses flush immediately.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
