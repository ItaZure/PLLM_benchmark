services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pllm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pllm_benchmark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pllm -d pllm_benchmark"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://pllm:${POSTGRES_PASSWORD}@db:5432/pllm_benchmark
      CORS_ORIGINS: http://localhost,http://localhost:8080,http://127.0.0.1:8080
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    # Single worker: in-memory cancellation registry (design doc 5.6).
    ports:
      - "8000:8000"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
