<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>评测生成模型 · PLLM Benchmark</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --border: rgba(0,0,0,0.08); }
  body { font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; }
  .mono { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .nav-item { height:36px; border-radius:6px; padding:0 12px; display:flex; align-items:center; gap:8px; font-size:13px; color:rgba(0,0,0,.65); text-decoration:none; }
  .nav-item:hover { background:#f0f0f0; }
  .nav-item.active { background:#ececec; color:#1a1a1a; font-weight:500; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:rgba(0,0,0,.4); box-shadow:0 0 0 3px rgba(0,0,0,.06); }
</style>
</head>
<body class="bg-white antialiased text-[13px]">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar"></div>
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 shrink-0 flex items-center justify-between px-6 border-b border-[var(--border)]">
      <h1 class="text-[18px] font-semibold">评测生成模型</h1>
      <button id="btnSaveAll" class="h-8 px-3.5 rounded-md bg-[#1a1a1a] text-white text-[13px] font-medium hover:bg-black active:scale-[0.98] transition">保存全部</button>
    </header>
    <main class="flex-1 overflow-auto p-6">
      <div class="max-w-2xl space-y-5">
        <p class="text-[13px] text-black/55 leading-relaxed">
          为每个维度单独设置 AI 出题用的生成模型。在任务管理里点击【自动生成】时，
          将使用该维度对应的模型生成题目。选项来自 Chat 模型列表。
        </p>
        <div id="dimList" class="space-y-3"></div>
        <div id="emptyState" class="hidden text-[13px] text-black/40">
          暂无维度。请先在<a href="/dimensions.html" class="underline ml-0.5">维度管理</a>中添加维度。
        </div>
      </div>
    </main>
  </div>
</div>
<script src="assets/app.js"></script>
<script src="assets/generation-model-page.js"></script>
</body>
</html>
